baseURL = "https://zhangdapeng.dev/"

languageCode = "en-us"
defaultContentLanguage = "en"

title = "Daniel Zhang"
theme = "hugo-theme-stack"

hasCJKLanguage = true
summaryLength = 140
paginate = 10

enableRobotsTXT = true


[languages.en]
    languageName = "English"
    weight = 1
    title = "Daniel Zhang"

[languages.zh-cn]
    languageName = "中文"
    weight = 2
    title = "Daniel Zhang"

[permalinks]
    posts = "/p/:slug"

    [permalinks.section]
        posts = "/post/"

[outputs]
    home = ["HTML", "RSS", "JSON"]
    page = ["HTML"]
    section = ["HTML", "RSS", "JSON"]

# ============================================================
# Site Parameters
# ============================================================

[params]

    mainSections = ["posts"]

    favicon = "/favicon.ico"
    
    defaultImage = "/images/og-default.webp"

    description = "Personal technical portfolio and blog of Daniel Zhang, covering independent development, AI coding, Linux, cloud infrastructure, Go, Python, and modern web development."

    keywords = [
        "Daniel Zhang",
        "Independent Developer",
        "Software Engineer",
        "AI Coding",
        "AI Development",
        "Golang",
        "Python",
        "Linux",
        "Cloud Native",
        "VPS",
        "System Architecture",
        "Remote Development"
    ]

    author = "Daniel Zhang"

    # ========================================================
    # Color Scheme
    # ========================================================

    [params.colorScheme]
        toggle = true
        default = "dark"

    # ========================================================
    # Sidebar
    # ========================================================

    [params.sidebar]
        emoji = "👨‍💻"
        subtitle = "Independent Developer | Full-Stack Engineer"
        avatar = "img/avatar.png"

    # ========================================================
    # Date Format
    # ========================================================

    [params.dateFormat]
        published = "Jan 02, 2006"
        lastUpdated = "Jan 02, 2006 15:04 MST"

    # ========================================================
    # Article
    # ========================================================

    [params.article]
        math = false
        toc = true
        readingTime = true

        [params.article.license]
            enabled = true
            default = "CC BY-NC-ND 4.0"

    # ========================================================
    # Widgets
    # ========================================================

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "archives", params = { limit = 5 } },
            { type = "categories", params = { limit = 10 } },
            { type = "tag-cloud", params = { limit = 10 } }
        ]


# ============================================================
# Menu
# ============================================================

[menu]

    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 1

        [menu.main.params]
            icon = "home"

    [[menu.social]]
        identifier = "github"
        name = "GitHub"
        url = "https://github.com/durban89"

        [menu.social.params]
            icon = "brand-github"

    [[menu.social]]
        identifier = "twitter"
        name = "Twitter"
        url = "https://twitter.com/durban_zhang"

        [menu.social.params]
            icon = "brand-twitter"


# ============================================================
# Google Analytics
# ============================================================

[services]

    [services.googleAnalytics]
        id = "G-3X47GTJY01"

